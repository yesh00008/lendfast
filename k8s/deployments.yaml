---
# ─── API Gateway (8300) ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lendfast-api-gateway
  namespace: lendfast
  labels:
    app: lendfast-api-gateway
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lendfast-api-gateway
  template:
    metadata:
      labels:
        app: lendfast-api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8300"
    spec:
      containers:
      - name: api-gateway
        image: lendfast/api-gateway:latest
        imagePullPolicy: Never
        ports:
        - { containerPort: 8300, name: http }
        envFrom:
        - configMapRef: { name: lendfast-config }
        - secretRef:    { name: lendfast-secrets }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "500m" }
        livenessProbe:
          httpGet: { path: /health, port: 8300 }
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 8300 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lendfast-api-gateway
  namespace: lendfast
spec:
  selector:
    app: lendfast-api-gateway
  ports:
  - { port: 8300, targetPort: 8300, name: http }

