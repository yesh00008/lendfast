---
# ─── PostgreSQL ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lendfast-postgres
  namespace: lendfast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lendfast-postgres
  template:
    metadata:
      labels:
        app: lendfast-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - { name: POSTGRES_DB, value: lendfast }
        - { name: POSTGRES_USER, value: lendfast }
        - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: lendfast-secrets, key: DB_PASSWORD } } }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "512Mi", cpu: "500m" }
        volumeMounts:
        - { name: postgres-data, mountPath: /var/lib/postgresql/data }
      volumes:
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lendfast-postgres
  namespace: lendfast
spec:
  selector:
    app: lendfast-postgres
  ports:
  - { port: 5432, targetPort: 5432 }

---
# ─── Redis ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lendfast-redis
  namespace: lendfast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lendfast-redis
  template:
    metadata:
      labels:
        app: lendfast-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "lendfast_redis_pass"]
        ports:
        - containerPort: 6379
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits:   { memory: "128Mi", cpu: "250m" }
---
apiVersion: v1
kind: Service
metadata:
  name: lendfast-redis
  namespace: lendfast
spec:
  selector:
    app: lendfast-redis
  ports:
  - { port: 6379, targetPort: 6379 }

---
# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lendfast-rabbitmq
  namespace: lendfast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lendfast-rabbitmq
  template:
    metadata:
      labels:
        app: lendfast-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - { containerPort: 5672, name: amqp }
        - { containerPort: 15672, name: mgmt }
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: lendfast }
        - { name: RABBITMQ_DEFAULT_PASS, value: lendfast_pass }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: lendfast-rabbitmq
  namespace: lendfast
spec:
  selector:
    app: lendfast-rabbitmq
  ports:
  - { port: 5672, targetPort: 5672, name: amqp }
  - { port: 15672, targetPort: 15672, name: mgmt }
